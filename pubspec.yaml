name: uconnect_mobile
description: "uConnect for phones and tablets: browse and share files with your computers, end-to-end encrypted, over the uconnect library."
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  cryptography: ^2.7.0
  crypto: ^3.0.3
  path_provider: ^2.1.0
  file_picker: ^10.0.0
  share_plus: ^12.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  unorm_dart: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
